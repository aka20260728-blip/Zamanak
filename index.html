<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAMANAK - الرئيسية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="zamanak-grid">
        
        <!-- 🧩 الجناح الأيسر: المسابقة الثقافية الفلكية (20% من الشاشة) -->
        <div class="left-wing">
            <h3 id="leftWingTitle">🧠 المسابقة الثقافية</h3>
            <hr style="border: 0; border-top: 1px solid rgba(0,242,254,0.2); margin:10px 0;">
            
            <!-- لوحة النتائج العلوية للصح والخطأ -->
            <div class="quiz-counters">
                <div><span id="correctLabel">الصح: </span><span id="correctScore" style="color:#00ff87; font-weight:bold;">0</span></div>
                <div><span id="wrongLabel">الخطأ: </span><span id="wrongScore" style="color:#ff0055; font-weight:bold;">0</span></div>
            </div>

            <!-- حاوية الأسئلة والخيارات التفاعلية -->
            <div id="quizBox" style="background:rgba(0,0,0,0.2); padding:12px; border-radius:6px;">
                <p id="quizQuestionText" style="font-weight:600; font-size:14px; margin-bottom:10px; color:var(--neon-cyan);"></p>
                <div id="quizOptionsContainer"></div>
            </div>
        </div>

        <!-- 🚀 المحتوى المركزي: العرض الأساسي للمنصة والكروت الثلاثية (60% من الشاشة) -->
        <div class="center-content">
            <!-- شريط التبديل العلوي الروقان وشريط التنقل -->
            <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <div style="font-weight:900; letter-spacing:1px; color:var(--neon-cyan); font-size:20px;">ZAMANAK 🚀</div>
                <nav style="display:flex; gap:15px; font-size:13px;">
                    <a href="index.html" style="color:var(--neon-cyan); text-decoration:none; font-weight:bold;">الرئيسية</a>
                    <a href="#" style="color:var(--text-muted); text-decoration:none;">الميلاد</a>
                    <a href="#" style="color:var(--text-muted); text-decoration:none;">الزواج</a>
                    <a href="#" style="color:var(--text-muted); text-decoration:none;">الخصوصية</a>
                    <a href="#" style="color:var(--text-muted); text-decoration:none;">الشروط</a>
                    <a href="#" style="color:var(--text-muted); text-decoration:none;">اتصل بنا</a>
                </nav>
                <button id="langSwitcher" class="zamanak-btn" style="width:auto; padding:4px 12px; font-size:12px;">العربية / EN</button>
            </header>

            <!-- شريط الإعلان الأزرق الممتد المنسق من الصورة -->
            <div class="top-announcement" id="announcementText"></div>

            <!-- الكتلة الترحيبية المركزية الفاخرة -->
            <section style="text-align:center; padding:20px 0;">
                <div style="display:inline-block; font-size:40px; margin-bottom:10px;">🌌</div>
                <h1 id="mainTitleText" style="font-size:24px; color:#fff; margin-bottom:10px;"></h1>
                <p id="welcomeText" style="color:var(--text-muted); max-width:650px; margin:0 auto; font-size:14px;"></p>
            </section>

            <!-- صف كروت المعمارية الفلكية الثلاثية المنسقة هندسياً من صورة العميل -->
            <div class="cards-row">
                <div class="zamanak-card">
                    <h4 id="c1Title" style="color:var(--neon-cyan); margin-bottom:8px;"></h4>
                    <p id="c1Desc" style="color:var(--text-muted); text-align:justify;"></p>
                </div>
                <div class="zamanak-card" style="border-top-color: #a855f7;">
                    <h4 id="c2Title" style="color:#a855f7; margin-bottom:8px;"></h4>
                    <p id="c2Desc" style="color:var(--text-muted); text-align:justify;"></p>
                </div>
                <div class="zamanak-card" style="border-top-color: #eab308;">
                    <h4 id="c3Title" style="color:#eab308; margin-bottom:8px;"></h4>
                    <p id="c3Desc" style="color:var(--text-muted); text-align:justify;"></p>
                </div>
            </div>
        </div>

        <!-- 🎮 الجناح الأيمن: لعبة التسلية وحساب طاقة النجوم السريعة (20% من الشاشة) -->
        <div class="right-wing">
            <h3 id="rightWingTitle">🎮 جناح التسلية السريعة</h3>
            <hr style="border: 0; border-top: 1px solid rgba(255,0,127,0.2); margin:10px 0;">
            
            <p style="font-size:12px; color:var(--text-muted);" id="clickActionText"></p>
            
            <!-- مساحة ضغط طاقة النيون التفاعلية السريعة -->
            <div class="neon-clicker-area" id="neonClicker">
                ⚡ ENERGY PUNCH
            </div>

            <div style="margin-top:15px; background:rgba(0,0,0,0.3); padding:10px; border-radius:6px; text-align:center; font-size:13px;">
                <span id="scorePrefix"></span>
                <span id="liveGameScore" style="color:var(--neon-pink); font-weight:bold; font-size:16px;">0</span>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
