<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamanak | زمانك العالمي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="global-navbar">
        <a href="index.html" class="logo-link">✨ ZAMANAK</a>
        <nav class="nav-links">
            <a href="index.html" id="nav-home" class="active">الرئيسية</a>
            <a href="birthday.html" id="nav-birth">الميلاد</a>
            <a href="marriage.html" id="nav-marriage">الزواج</a>
            <a href="privacy.html" id="nav-privacy">الخصوصية</a>
            <a href="terms.html" id="nav-terms">الشروط</a>
            <a href="contact.html" id="nav-contact">اتصل بنا</a>
        </nav>
        <div class="controls-group">
            <select id="languageSelect"><option value="ar">العربية 🇸🇦</option><option value="en">English 🇬🇧</option></select>
            <button id="darkModeToggle" class="theme-btn">🌓</button>
        </div>
    </header>

    <div class="three-column-layout">
        <!-- الجناح الأيمن الترفيهي -->
        <aside class="side-wing">
            <div class="wing-title" id="wing-game-title">اضغط لتجميع طاقة النجوم ✨</div>
            <p id="game-score-text" style="font-size:0.9rem; text-align:center;">النقاط الفلكية الحالية: 0</p>
            <button class="game-btn" id="game-click-btn" onclick="playZamanakGame()">اضغط هنا 🌟</button>
        </aside>

        <!-- المحتوى المركزي الموسط -->
        <main class="center-content">
            <div class="adsense-placeholder-box"><div id="movingAdText" class="moving-text">..</div></div>
            <div class="tool-header">
                <h1 id="main-title">🌌 منصة زمانك (Zamanak) الفلكية الشاملة</h1>
                <p id="main-desc" style="opacity: 0.8; margin-top: 5px;">..</p>
            </div>
            <section class="articles-grid">
                <div class="info-card"><h4 id="art1-title">..</h4><p id="art1-text">..</p></div>
                <div class="info-card"><h4 id="art2-title">..</h4><p id="art2-text">..</p></div>
                <div class="info-card"><h4 id="art3-title">..</h4><p id="art3-text">..</p></div>
            </section>
        </main>

        <!-- الجناح الأيسر للألغاز -->
        <aside class="side-wing">
            <div class="wing-title" id="wing-puzzle-title">🔮 أسرار وألغاز طالعك</div>
            <p id="puzzle-q" style="font-size:0.9rem; text-align:justify;">س: ما هو الكوكب الأكثر لمعاناً في سماء الليل؟</p>
            <button class="puzzle-btn" id="puzzle-btn-text" onclick="revealPuzzle()">عرض الإجابة الفلكية</button>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
