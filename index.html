<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAMANAK - المنظومة الفلكية الشاملة</title>
    <!-- استدعاء فكرتك العبقرية لتقسيم التنسيق مع منع التخزين المؤقت -->
    <link rel="stylesheet" href="layout.css?v=1.3">
    <link rel="stylesheet" href="theme.css?v=1.3">
    <link rel="stylesheet" href="components.css?v=1.3">
</head>
<body>

    <header class="zamanak-navbar-fixed">
        <div class="nav-brand">ZAMANAK 🚀</div>
        <nav class="nav-links-wrap">
            <a href="index.html" class="active">الرئيسية</a>
            <a href="birth.html">حساب الميلاد</a>
            <a href="marriage.html">حساب الزواج</a>
            <a href="privacy.html">الخصوصية</a>
            <a href="terms.html">الشروط والأحكام</a>
            <a href="contact.html">اتصل بنا</a>
        </nav>
        <button id="langSwitcher" class="zamanak-btn" style="font-size:11px; padding:4px 10px;">العربية / EN</button>
    </header>

    <div class="zamanak-grid-core">
        
        <div class="left-wing">
            <h3 id="leftWingTitle" style="font-size:15px; color:#fff;">🧠 مسابقة زمانك الفلكية</h3>
            <hr style="border:0; border-top:1px solid rgba(0,242,254,0.2); margin:10px 0;">
            <div class="quiz-counters">
                <span style="font-weight:bold; color:#00f2fe;">المجموع: </span>
                <span id="liveQuizScore" style="color:#00ff87; font-weight:bold; font-size:15px;">0</span>
            </div>
            <div id="quizBox">
                <p id="quizQuestionText" style="font-weight:600; font-size:13px; margin-bottom:10px;"></p>
                <div id="quizOptionsContainer"></div>
            </div>
        </div>

        <div class="center-content">
            <div class="top-announcement" id="announcementText"></div>
            <section style="text-align:center; padding:10px 0;">
                <h1 id="mainTitleText" style="font-size:22px; color:#fff; margin-bottom:8px;"></h1>
                <p id="welcomeText" style="color:#8fa0b5; font-size:13px; max-width:600px; margin:0 auto;"></p>
            </section>

            <div class="cards-row">
                <div class="zamanak-card"><h4 id="c1Title" style="color:#00f2fe; margin-bottom:6px;"></h4><p id="c1Desc" style="color:#8fa0b5; text-align:justify;"></p></div>
                <div class="zamanak-card" style="border-top-color: #a855f7;"><h4 id="c2Title" style="color:#a855f7; margin-bottom:6px;"></h4><p id="c2Desc" style="color:#8fa0b5; text-align:justify;"></p></div>
                <div class="zamanak-card" style="border-top-color: #eab308;"><h4 id="c3Title" style="color:#eab308; margin-bottom:6px;"></h4><p id="c3Desc" style="color:#8fa0b5; text-align:justify;"></p></div>
            </div>

            <div class="cards-row">
                <div class="zamanak-card" style="border-top-color: #10b981;"><h4 id="infoCard1Title" style="color:#10b981; margin-bottom:6px;"></h4><p id="infoCard1Desc" style="color:#8fa0b5; text-align:justify;"></p></div>
                <div class="zamanak-card" style="border-top-color: #f59e0b;"><h4 id="infoCard2Title" style="color:#f59e0b; margin-bottom:6px;"></h4><p id="infoCard2Desc" style="color:#8fa0b5; text-align:justify;"></p></div>
                <div class="zamanak-card" style="border-top-color: #ec4899;"><h4 id="infoCard3Title" style="color:#ec4899; margin-bottom:6px;"></h4><p id="infoCard3Desc" style="color:#8fa0b5; text-align:justify;"></p></div>
                <div class="zamanak-card" style="border-top-color: #3b82f6;"><h4 id="infoCard4Title" style="color:#3b82f6; margin-bottom:6px;"></h4><p id="infoCard4Desc" style="color:#8fa0b5; text-align:justify;"></p></div>
            </div>

            <div class="article-box"><h3 id="art1TitleText"></h3><p id="art1BodyText" style="color:#8fa0b5; font-size:13px; text-align:justify;"></p></div>
            <div class="article-box" style="border-color: rgba(168, 85, 247, 0.15);"><h3 id="art2TitleText" style="color:#a855f7;"></h3><p id="art2BodyText" style="color:#8fa0b5; font-size:13px; text-align:justify;"></p></div>
            <div class="article-box" style="border-color: rgba(234, 179, 8, 0.15);"><h3 id="art3TitleText" style="color:#eab308;"></h3><p id="art3BodyText" style="color:#8fa0b5; font-size:13px; text-align:justify;"></p></div>
        </div>

        <div class="right-wing">
            <h3 id="rightWingTitle" style="font-size:15px; color:#fff;">🎮 جناح التسلية وإنهاء الملل</h3>
            <hr style="border:0; border-top:1px solid rgba(255,0,127,0.2); margin:10px 0;">
            <div class="game-counters">
                <p id="clickActionText" style="font-size:11px; margin-bottom:5px;"></p>
                <div style="display:flex; justify-content:space-between; font-size:12px; margin-top:5px;">
                    <div><span id="scorePrefix">النقاط: </span><span id="liveGameScore" style="color:#ff007f; font-weight:bold;">0</span></div>
                    <div><span>المحاولات: </span><span id="gameShotsCount" style="color:#00f2fe; font-weight:bold;">0</span>/10</div>
                </div>
            </div>
            <div class="pitch-container" id="gamePitch">
                <div class="astral-goal-post" id="goalPost"></div>
                <div class="cosmic-ball" id="shootBall"></div>
            </div>
            <div id="gameResultAlert" style="display:none; margin-top:12px; background:rgba(255,0,127,0.15); border:1px solid #ff007f; padding:10px; border-radius:6px; text-align:center; font-size:12px;"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
