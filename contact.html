<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا | Zamanak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="global-navbar">
        <a href="index.html" class="logo-link">✨ ZAMANAK</a>
        <nav class="nav-links">
            <a href="index.html" id="nav-home">الرئيسية</a>
            <a href="birthday.html" id="nav-birth">الميلاد</a>
            <a href="marriage.html" id="nav-marriage">الزواج</a>
            <a href="privacy.html" id="nav-privacy">الخصوصية</a>
            <a href="terms.html" id="nav-terms">الشروط</a>
            <a href="contact.html" id="nav-contact" class="active">اتصل بنا</a>
        </nav>
        <div class="controls-group">
            <select id="languageSelect">
                <option value="ar">العربية 🇸🇦</option>
                <option value="en">English 🇬🇧</option>
            </select>
            <button id="darkModeToggle" class="theme-btn">🌓</button>
        </div>
    </header>

    <main class="main-wrapper">
        <div class="tool-header"><h1 id="contact-title">✉️ اتصل بنا والدعم الفوري</h1></div>
        <div class="tool-card">
            <form onsubmit="event.preventDefault(); alert('تم استلام رسالتك الفورية سحابياً بنجاح في زمانك!');" style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
                <input type="text" placeholder="الاسم الكامل" required style="background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 8px; width: 100%;">
                <input type="email" placeholder="البريد الإلكتروني" required style="background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 8px; width: 100%;">
                <textarea rows="5" placeholder="نص الرسالة والاستفسار الكوني" required style="background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 8px; width: 100%;"></textarea>
                <button type="submit" style="background: var(--primary-gold); color: #0b0f19; border: none; font-weight: bold; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 1rem;">إرسال الرسالة الفورية</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
