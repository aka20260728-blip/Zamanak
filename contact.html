<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا | Zamanak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="global-navbar">
        <a href="index.html" class="logo-link">✨ ZAMANAK</a>
        <nav class="nav-links">
            <a href="index.html" id="nav-home">الرئيسية</a>
            <a href="birthday.html" id="nav-birth">الميلاد</a>
            <a href="marriage.html" id="nav-marriage">الزواج</a>
            <a href="privacy.html" id="nav-privacy">الخصوصية</a>
            <a href="terms.html" id="nav-terms">الشروط</a>
            <a href="contact.html" id="nav-contact" class="active">اتصل بنا</a>
        </nav>
        <div class="controls-group">
            <select id="languageSelect">
                <option value="ar">العربية 🇸🇦</option>
                <option value="en">English 🇬🇧</option>
                <option value="tr">Türkçe 🇹🇷</option>
                <option value="ur">اردو 🇵🇰</option>
            </select>
            <button id="darkModeToggle" class="theme-btn">🌓</button>
        </div>
    </header>

    <main class="main-wrapper">
        <div class="tool-header">
            <h1 id="contact-title">✉️ اتصل بنا والدعم الفوري</h1>
        </div>

        <div class="tool-card">
            <form class="zamanak-form" onsubmit="event.preventDefault(); alert('تم استلام طلبك بنجاح في قاعدة بيانات زمانك سحابياً!');">
                <input type="text" id="form-name" placeholder="الاسم الكامل" required style="margin-bottom: 12px;">
                <input type="email" id="form-email" placeholder="البريد الإلكتروني" required style="margin-bottom: 12px;">
                <textarea id="form-msg" rows="5" placeholder="نص الرسالة أو الاستفسار الفلكي" required style="margin-bottom: 15px;"></textarea>
                <button type="submit" id="form-submit" style="width: 100%; background: var(--primary-gold); color: #0b0f19; border: none; font-weight: bold; padding: 14px; font-size: 1rem; border-radius: 8px; cursor: pointer;">إرسال الرسالة الفورية</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
