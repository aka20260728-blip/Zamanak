<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا | Zamanak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="global-navbar">
        <a href="index.html" class="logo-link">✨ ZAMANAK</a>
        <nav class="nav-links">
            <a href="index.html" id="nav-home">الرئيسية</a>
            <a href="birthday.html" id="nav-birth">الميلاد</a>
            <a href="marriage.html" id="nav-marriage">الزواج</a>
            <a href="privacy.html" id="nav-privacy">الخصوصية</a>
            <a href="terms.html" id="nav-terms">الشروط</a>
            <a href="contact.html" id="nav-contact" class="active">اتصل بنا</a>
        </nav>
        <div class="controls-group">
            <select id="languageSelect"><option value="ar">العربية 🇸🇦</option><option value="en">English 🇬🇧</option></select>
            <button id="darkModeToggle" class="theme-btn">🌓</button>
        </div>
    </header>

    <div class="three-column-layout">
        <aside class="side-wing"><div class="wing-title" id="wing-game-title">..</div><p id="game-score-text" style="font-size:0.9rem; text-align:center;">النقاط الفلكية الحالية: 0</p><button class="game-btn" id="game-click-btn" onclick="playZamanakGame()">..</button></aside>

        <main class="center-content">
            <div class="tool-header"><h1 id="contact-title">✉️ اتصل بنا والدعم الفوري للخدمة</h1></div>
            <div class="tool-card">
                <!-- نموذج الدعم الفوري المعزز بالميكانيكية الذكية للتوجيه لإيميلك -->
                <form onsubmit="event.preventDefault(); sendZamanakEmail();" style="width: 100%;">
                    <input type="text" id="form-name" class="zamanak-form-input" required>
                    <input type="email" id="form-email" class="zamanak-form-input" required>
                    <textarea id="form-msg" rows="5" class="zamanak-form-input" required></textarea>
                    <button type="submit" id="form-submit" class="action-gradient-btn">إرسال الرسالة الفورية</button>
                </form>
            </div>
        </main>

        <aside class="side-wing"><div class="wing-title" id="wing-puzzle-title">..</div><p id="puzzle-q" style="font-size:0.9rem; text-align:justify;">..</p><button class="puzzle-btn" id="puzzle-btn-text" onclick="revealPuzzle()">..</button></aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
