<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة أسرار ميلادك الفلكي | Zamanak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="global-navbar">
        <a href="index.html" class="logo-link">✨ ZAMANAK</a>
        <nav class="nav-links">
            <a href="index.html" id="nav-home">الرئيسية</a>
            <a href="birthday.html" id="nav-birth" class="active">الميلاد</a>
            <a href="marriage.html" id="nav-marriage">الزواج</a>
            <a href="privacy.html" id="nav-privacy">الخصوصية</a>
            <a href="terms.html" id="nav-terms">الشروط</a>
            <a href="contact.html" id="nav-contact">اتصل بنا</a>
        </nav>
        <div class="controls-group">
            <select id="languageSelect"><option value="ar">العربية 🇸🇦</option><option value="en">English 🇬🇧</option></select>
            <button id="darkModeToggle" class="theme-btn">🌓</button>
        </div>
    </header>

    <div class="three-column-layout">
        <aside class="side-wing">
            <div class="wing-title" id="wing-game-title">..</div>
            <p id="game-score-text" style="font-size:0.9rem; text-align:center;">النقاط الفلكية الحالية: 0</p>
            <button class="game-btn" id="game-click-btn" onclick="playZamanakGame()">..</button>
        </aside>

        <main class="center-content">
            <div class="adsense-placeholder-box"><div id="movingAdText" class="moving-text">..</div></div>
            <div class="tool-header">
                <h1 id="birth-page-title">🎂 أسرار ميلادك الفلكي الكوني</h1>
                <p id="birth-page-desc" style="opacity:0.8; font-size:0.9rem; margin-top:5px;">..</p>
            </div>
            <div class="tool-card">
                <div class="calendar-switch">
                    <input type="checkbox" id="hijriCheckbox" style="width: 18px; height: 18px; cursor: pointer;">
                    <label for="hijriCheckbox" id="lbl-hijri" style="font-weight: bold; cursor: pointer;">..</label>
                </div>
                <div class="date-selector-box" onclick="openPopup('day')"><span id="lbl-select-day">..</span><span id="selectedDayText" style="color:var(--primary-gold); font-weight:bold;">-</span></div>
                <div class="date-selector-box" onclick="openPopup('month')"><span id="lbl-select-month">..</span><span id="selectedMonthText" style="color:var(--primary-gold); font-weight:bold;">-</span></div>
                <div class="date-selector-box" onclick="openPopup('year')"><span id="lbl-select-year">..</span><span id="selectedYearText" style="color:var(--primary-gold); font-weight:bold;">-</span></div>
            </div>
            <div id="loadingEffect" class="loading-box" style="display: none;"><div class="spinner"></div><p id="loadingText">..</p></div>
            
            <!-- بطاقة النتيجة الرقمية المصممة باحترافية كاملة -->
            <div id="resultContainer" class="tool-card" style="border: 2px solid var(--border-color);">
                <h3 id="res-title" style="color:var(--primary-gold); margin-bottom:15px; text-align:center; border-bottom:1px solid var(--border-color); padding-bottom:8px;">..</h3>
                <p style="margin-bottom:10px; display:none; color:var(--primary-gold); font-weight:bold;" id="hijriOutput">المقابل الهجري الفلكي الذكي (أم القرى) فعال ومربوط 🌙</p>
                <p style="margin-bottom:10px;"><span id="res-days">..</span> <span id="res-days-val" style="font-weight: bold; color: var(--primary-neon);">-</span></p>
                <p style="margin-bottom:10px;"><span id="res-hours">..</span> <span id="res-hours-val" style="font-weight: bold;">-</span></p>
                <p style="margin-bottom:15px;"><span id="res-minutes">..</span> <span id="res-mins-val" style="font-weight: bold; color: #2ecc71;">-</span></p>
                <div style="display:flex; gap:10px;">
                    <button class="action-gradient-btn" id="viralShareBtn" onclick="shareZamanakViral()">..</button>
                    <button class="game-btn" id="copyCardBtn" onclick="copyZamanakCard()">..</button>
                </div>
            </div>
        </main>

        <aside class="side-wing">
            <div class="wing-title" id="wing-puzzle-title">..</div>
            <p id="puzzle-q" style="font-size:0.9rem; text-align:justify;">..</p>
            <button class="puzzle-btn" id="puzzle-btn-text" onclick="revealPuzzle()">..</button>
        </aside>
    </div>

    <div id="datePopupModal" class="popup-modal"><div class="popup-content"><div class="popup-title" id="popupTitle">اختر</div><div class="grid-container" id="popupGridItems"></div></div></div>
    <script src="script.js"></script>
</body>
</html>
